# Example configuration for smtpmaster.
# Copy to smtpmaster.toml (next to the binary or passed with --config).
# Every value can be overridden with SMTPMASTER_* environment variables.

[mongodb]
uri = "mongodb://127.0.0.1:27017"
database = "smtpmaster"

[server]
listen = "0.0.0.0:2525"
hostname = "smtpmaster.local"
max_message_size = 26214400
max_recipients = 100
max_connections = 256
# priority | round-robin | time-window
mode = "priority"
# Maximum concurrent upstream sends. Ignored when sequential = true.
concurrency = 8
sequential = false
# Try this many accounts before giving up on a message.
max_attempts = 3
# Disable an account after N consecutive failures (0 disables the feature).
fail_threshold = 5
send_timeout_secs = 60
# Require AUTH from the external app (users must be configured below).
auth_required = false
# Rewrite the message From: header to the selected account identity.
rewrite_from_header = false

# Clients of the relay. Remove both entries if you do not use AUTH.
[[server.users]]
username = "relay"
password = "change-me"

[maintenance]
# Quota reset / expiry sweep interval while serving.
interval_secs = 30

[log]
# send_log documents older than this are removed by a TTL index.
retention_days = 14
